set -g default-shell /bin/bash
set -g default-command /bin/bash

set-option -g default-command "bash --rcfile $HOME/.config/tmux/.tmux-bashrc"

# Colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# set -g status-interval 10

# Status bar
set -g status-position top
set -g status-style "bg=#1e1e1e,fg=#ffffff"
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[bg=#000000,fg=white] #S #[default] "
set -g status-right "#(cat /sys/class/power_supply/BAT*/status | cut -c1) #(cat /sys/class/power_supply/BAT*/capacity)% 𑗅%b %d - %H:%M"
set -g status-interval 15

# Windows
# Window status
set -g window-status-format "#W"
set -g window-status-current-style "bold"

# Inactive windows
set -g window-status-format ' #W#F #[default]'
# Active window
set -g window-status-current-format  '#W#F #[default]'


# Panes
set -g pane-active-border-style "fg=#0078d4"

# Messages
set -g message-style "bg=#0078d4,fg=white"

# Border
set -g pane-border-lines single
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#0078d4"

# clipboard
set -s set-clipboard on
bind-key -T copy-mode M-w send -X copy-pipe-and-cancel "wl-copy"

# keymaps
bind -n C-p display-popup -w 70% -h 60% -d "#{pane_current_path}" -E
bind -n C-g display-popup -w 80% -h 70% -d "#{pane_current_path}" -E lazygit

# Clock mode
set -g clock-mode-style 24
set -g clock-mode-color colour23
